<script src="xterm.min.js"></script>
<script src="addon-fit.js"></script>

<script>
/* ============================================================
   0. ANSI 工具
   ============================================================ */
const C = {
  reset:'\x1b[0m', bold:'\x1b[1m', dim:'\x1b[2m', under:'\x1b[4m', rev:'\x1b[7m',
  fg:   '\x1b[38;2;217;213;204m',   // 主文字 暖白
  soft: '\x1b[38;2;138;144;132m',   // 次要灰绿
  grn:  '\x1b[38;2;143;179;154m',   // 墨绿亮（目录/强调）
  grn2: '\x1b[38;2;110;140;116m',   // 墨绿深（标签）
  sand: '\x1b[38;2;194;161;122m',   // 暖砂（数字/路径）
  red:  '\x1b[38;2;198;122;110m',
  cyan: '\x1b[38;2;140;166;170m',
};
const P = (t,c)=> c + t + C.reset;
const stripAnsi = s => String(s).replace(/\x1b\[[0-9;]*m/g,'');
/* 中文等全角字符在终端里占两列 */
const dispW = s => String(s).split('').reduce((n,ch)=> n + (/[\u2E80-\u9FFF\uFF00-\uFFEF\u3000-\u303F\u2500-\u257F]/.test(ch) ? 2 : 1), 0);
const padTo = (s,w) => s + ' '.repeat(Math.max(1, w - dispW(s)));
const rpad  = (s,w) => ' '.repeat(Math.max(0, w - dispW(s))) + s;

/* ============================================================
   1. 虚拟文件系统
   ============================================================ */
const fs = {
  name:'/', type:'dir', children:{
    home:{name:'home',type:'dir',children:{
      guest:{name:'guest',type:'dir',children:{
        'README.md':{name:'README.md',type:'file',content:
`# termbook

一打开就是终端的网页。

- 终端仿真：xterm.js
- 命令解释：本项目自研的 JS shell
- 文件系统：内存中的一棵虚拟树

输入 help 看命令，about 看它是怎么搭的。`},
        notes:{name:'notes',type:'dir',children:{
          '秋日笔记.md':{name:'秋日笔记.md',type:'file',content:
`# 秋日笔记

九月末的沈阳，风已经带上了凉意。
天色暗得早，人也顺理成章地慢下来。

- 早上先写当天最重要的那件事
- 午后走十五分钟，不带手机
- 睡前记一行流水账`},
          '配色方案.md':{name:'配色方案.md',type:'file',content:
`# 配色方案

| 角色   | 色值      |
|--------|-----------|
| 暖灰底 | #E9E5DF   |
| 深灰字 | #34322E   |
| 墨绿   | #4C5F50   |

终端里把这套色系反转：深底 #1C1F1B，墨绿提到 #8FB39A。`},
        }},
        blog:{name:'blog',type:'dir',children:{}},
      }},
    }},
    etc:{name:'etc',type:'dir',children:{
      'motd':{name:'motd',type:'file',content:'欢迎回来。今天也请把节奏放慢一点。'},
      'hosts':{name:'hosts',type:'file',content:'127.0.0.1  localhost\n::1        localhost'},
    }},
    var:{name:'var',type:'dir',children:{
      log:{name:'log',type:'dir',children:{
        'syslog':{name:'syslog',type:'file',content:
`09:01:12 termbook kernel: boot ok
09:01:13 termbook xterm[1]: renderer=dom ready
09:04:51 termbook auth: user 'guest' login
09:12:07 termbook sh[12]: warn  no backend attached (expected)`},
      }},
    }},
  }
};

let cwd = ['home','guest'];
const pwdStr  = () => '/' + cwd.join('/');
const homeStr = '/home/guest';
const dispPath = () => {
  const p = pwdStr();
  return p === homeStr ? '~' : (p.startsWith(homeStr) ? '~' + p.slice(homeStr.length) : p);
};
function resolve(parts){
  let node = fs, stack = [];
  for (const seg of parts){
    if (seg === '' || seg === '.') continue;
    if (seg === '..'){ stack.pop(); node = fs; for (const s of stack) node = node.children[s]; continue; }
    if (!node || node.type !== 'dir' || !node.children[seg]) return null;
    node = node.children[seg]; stack.push(seg);
  }
  return node;
}
const splitPath = p => {
  const raw = (!p || p === '~')
    ? cwd.slice()
    : ((p.startsWith('~/') || p.startsWith('/')) ? [] : cwd.slice())
      .concat(p.replace(/^~/,'/').split('/').filter(Boolean));
  const normalized = [];
  for (const segment of raw){
    if (!segment || segment === '.') continue;
    if (segment === '..') { normalized.pop(); continue; }
    normalized.push(segment);
  }
  return normalized;
};
const getNode = p => resolve(splitPath(p));
const parentOf = p => { const s = splitPath(p).slice(); return {name:s.pop()||'', parent:resolve(s)||fs}; };

const blogDirectory = () => fs.children.home.children.guest.children.blog;
async function requestJson(path){
  const response = await fetch(path, { headers: { Accept: 'application/json' } });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload?.error?.message || `HTTP ${response.status}`);
  return payload;
}
async function syncBlogDirectory(){
  const payload = await requestJson('/api/public/posts?page=1&pageSize=50');
  const posts = Array.isArray(payload.data) ? payload.data : [];
  const children = {};
  for (const post of posts){
    const name = `${post.slug}.md`;
    children[name] = { name, type:'file', content:null, remote:true, title:post.title };
  }
  blogDirectory().children = children;
  return posts;
}
function blogSlugFromPath(path){
  const parts = splitPath(path);
  if (parts.length !== 4 || parts[0] !== 'home' || parts[1] !== 'guest' || parts[2] !== 'blog') return null;
  return parts[3].replace(/\.md$/, '');
}
async function readBlogPost(path){
  const slug = blogSlugFromPath(path);
  if (!slug) return null;
  const payload = await requestJson(`/api/public/posts/${encodeURIComponent(slug)}`);
  const post = payload.data;
  const name = `${slug}.md`;
  blogDirectory().children[name] = { name, type:'file', content:post.bodyMarkdown, remote:true, title:post.title };
  return post.bodyMarkdown;
}

/* ============================================================
   2. 命令
   ============================================================ */
const CMDS = {};
const def = (n, fn, help, usage) => { CMDS[n] = {fn, help, usage}; };

def('help', () => {
  const names = Object.keys(CMDS).sort();
  const out = ['', P('可用命令', C.bold) + '  ' + P('（man <命令> 看用法）', C.soft), ''];
  for (const n of names) out.push('  ' + P(n.padEnd(10), C.grn) + P(CMDS[n].help, C.soft));
  out.push('', P('管道：', C.soft) + 'ls -l | grep md    ' + P('重定向输出：', C.soft) + 'ls > out.txt',
           P('快捷键：', C.soft) + 'Tab 补全   ↑↓ 历史   Ctrl+C 中断   Ctrl+L 清屏', '');
  return out;
}, '显示这份帮助');

def('man', ({args}) => {
  const n = args[0];
  if (!n || !CMDS[n]) return [P('用法: man <命令>', C.soft), P('可用：', C.soft) + Object.keys(CMDS).sort().join(' ')];
  const c = CMDS[n];
  const usage = c.usage || (typeof c.fn === 'function' ? '' : '');
  return ['', P('名称', C.grn2) + '    ' + n + ' — ' + c.help,
          P('用法', C.grn2) + '    ' + (c.usage ? c.usage : n), ''];
}, '查看某个命令的用法');

def('ls', async ({args}) => {
  const long = args.some(a => /^-l|-la|-al$/.test(a));
  const all  = args.some(a => /^-a|-la|-al$/.test(a));
  const target = args.find(a => !a.startsWith('-')) || '.';
  const targetParts = splitPath(target);
  if (targetParts.length === 3 && targetParts[0] === 'home' && targetParts[1] === 'guest' && targetParts[2] === 'blog') {
    try { await syncBlogDirectory(); }
    catch (error) { return [P(`ls: blog: ${error.message}`, C.red)]; }
  }
  const node = getNode(target);
  if (!node) return [P(`ls: ${target}: 没有那个文件或目录`, C.red)];
  if (node.type === 'file') return [node.name];
  let keys = Object.keys(node.children).sort();
  if (!all) keys = keys.filter(k => !k.startsWith('.'));
  if (!keys.length) return [P('（空目录）', C.soft)];
  if (!long) return keys.map(k => node.children[k].type === 'dir' ? P(k + '/', C.grn) : k);
  return keys.map(k => {
    const n = node.children[k], isDir = n.type === 'dir';
    const size = n.type === 'file' ? String(n.content.length) : '—';
    return P(isDir ? 'drwxr-xr-x' : '-rw-r--r--', C.soft) + '  ' + P('guest', C.grn2) + '  ' +
           P(rpad(size, 7), C.sand) + '  ' + (isDir ? P(k + '/', C.grn) : k);
  });
}, '列出目录内容（-l 详细  -a 含隐藏）');

def('cd', ({args, setCwd}) => {
  const p = args[0] || '~';
  const node = getNode(p);
  if (!node) return [P(`cd: ${p}: 没有那个文件或目录`, C.red)];
  if (node.type !== 'dir') return [P(`cd: ${p}: 不是目录`, C.red)];
  const parts = splitPath(p); setCwd(parts.length ? parts : []);
  return [];
}, '切换目录', 'cd <目录>');

def('pwd', () => [pwdStr()], '显示当前路径');
def('whoami', () => ['guest'], '显示当前用户');
def('date', () => [new Date().toLocaleString('zh-CN',{hour12:false})], '显示当前时间');
def('uptime', () => [`已运行 ${Math.floor((Date.now()-bootAt)/1000)} 秒 · 负载 0.00 0.01 0.05 · 无需后端`], '显示运行时长');
def('uname', ({args}) => [args.includes('-a')
  ? 'termbook 0.2.0 browser x86_64 WebAssembly JavaScript'
  : 'termbook'], '显示系统信息');

def('cat', async ({args}) => {
  if (!args.length) return [P('用法: cat <文件>', C.soft)];
  const out = [];
  for (const p of args){
    let n = getNode(p);
    const slug = blogSlugFromPath(p);
    if (slug && (!n || n.content == null)) {
      try {
        await readBlogPost(p);
        n = getNode(p);
      } catch (error) {
        out.push(P(`cat: ${p}: ${error.message}`, C.red));
        continue;
      }
    }
    if (!n) { out.push(P(`cat: ${p}: 没有那个文件`, C.red)); continue; }
    if (n.type === 'dir') { out.push(P(`cat: ${p}: 是一个目录`, C.red)); continue; }
    out.push(n.content);
  }
  return out;
}, '查看文件内容', 'cat <文件>');

def('tree', ({args}) => {
  const root = getNode(args[0] || '.');
  if (!root) return [P('tree: 路径不存在', C.red)];
  const lines = [P(dispPath(), C.grn)];
  const walk = (node, prefix) => {
    const keys = Object.keys(node.children).sort();
    keys.forEach((k,i) => {
      const last = i === keys.length-1, n = node.children[k];
      lines.push(prefix + (last?'└── ':'├── ') + (n.type==='dir' ? P(k+'/',C.grn) : k));
      if (n.type === 'dir') walk(n, prefix + (last?'    ':'│   '));
    });
  };
  if (root.type === 'dir') walk(root,''); else lines.push(root.name);
  return lines;
}, '树状展示目录', 'tree [目录]');

def('echo', ({args}) => [args.join(' ')], '输出一行文本', 'echo <文本>');
def('mkdir', ({args}) => {
  if (!args[0]) return [P('用法: mkdir <目录名>', C.soft)];
  const p = getNode('.');
  if (p.children[args[0]]) return [P(`mkdir: ${args[0]}: 已存在`, C.red)];
  p.children[args[0]] = {name:args[0], type:'dir', children:{}};
  return [];
}, '创建目录', 'mkdir <目录名>');
def('touch', ({args}) => {
  if (!args[0]) return [P('用法: touch <文件名>', C.soft)];
  getNode('.').children[args[0]] = {name:args[0], type:'file', content:''};
  return [];
}, '创建空文件', 'touch <文件名>');
def('rm', ({args}) => {
  const p = args.find(a=>!a.startsWith('-'));
  if (!p) return [P('用法: rm <文件或目录>', C.soft)];
  const {name, parent} = parentOf(p);
  if (!parent.children || !parent.children[name]) return [P(`rm: ${p}: 不存在`, C.red)];
  delete parent.children[name];
  return [];
}, '删除文件或目录', 'rm <路径>');
def('cp', ({args}) => {
  if (args.length < 2) return [P('用法: cp <源> <目标>', C.soft)];
  const src = getNode(args[0]);
  if (!src) return [P(`cp: ${args[0]}: 不存在`, C.red)];
  const {parent} = parentOf(args[1]);
  parent.children[args[1].split('/').pop()] = JSON.parse(JSON.stringify(src));
  return [];
}, '复制文件或目录', 'cp <源> <目标>');
def('mv', ({args}) => {
  if (args.length < 2) return [P('用法: mv <源> <目标>', C.soft)];
  const src = getNode(args[0]);
  if (!src) return [P(`mv: ${args[0]}: 不存在`, C.red)];
  const {name, parent} = parentOf(args[0]);
  const {parent:dst} = parentOf(args[1]);
  dst.children[args[1].split('/').pop()] = src;
  delete parent.children[name];
  return [];
}, '移动或重命名', 'mv <源> <目标>');

def('history', ({env}) => env.history.map((h,i)=> P(rpad(String(i+1),5), C.sand) + h), '显示历史命令');
def('clear', ({env}) => { env.clear(); return []; }, '清屏（Ctrl+L）');
def('grep', ({args, stdin}) => {
  const pat = args[0] || '';
  return (stdin.length ? stdin : []).filter(l => stripAnsi(l).includes(pat));
}, '过滤包含关键字的行', 'grep <关键字>');
def('wc', ({stdin}) => [P(String(stdin.length), C.sand) + ' 行  ' +
  P(String(stdin.reduce((s,l)=>s+stripAnsi(l).length,0)), C.sand) + ' 字符'], '统计行数与字符数');
def('head', ({args, stdin}) => stdin.slice(0, parseInt(args[0])||10), '取前 N 行', 'head [N]');
def('tail', ({args, stdin}) => { const n = parseInt(args[0])||10; return stdin.slice(-n); }, '取后 N 行', 'tail [N]');
def('sort', ({stdin}) => stdin.slice().sort(), '排序');
def('uniq', ({stdin}) => stdin.filter((l,i)=> stripAnsi(l) !== stripAnsi(stdin[i-1])), '去重相邻重复行');

def('theme', ({args, env}) => {
  const t = args[0] || 'dark';
  if (t === 'light') env.setTheme({
    background:'#F2EEE9', foreground:'#34322E', cursor:'#4C5F50', cursorAccent:'#F2EEE9',
    selectionBackground:'#D6D0C7', black:'#F2EEE9', brightBlack:'#9A948A',
    red:'#A85A4E', green:'#4C5F50', yellow:'#8A6D3B', blue:'#5A6E73',

    red:'#C67A6E', green:'#8FB39A', yellow:'#C2A17A', blue:'#8CA6AA',
    magenta:'#A98BA0', cyan:'#8CA6AA', white:'#D9D5CC', brightWhite:'#EFECE5'
  });
  return [P('已切换到 ' + t + ' 主题', C.grn)];
}, '切换主题：light | dark', 'theme <light|dark>');

def('neofetch', () => {
  const logo = ['   ┌───────────┐ ','   │ ▚▚▚   ▚▚ │ ','   │  termbook │ ',
                '   │ ▞▞▞   ▞▞ │ ','   └───────────┘ ','   ╰───────────╯ '];
  const row = (k,v) => P(k, C.grn2) + padTo('', 8 - dispW(k)) + v;
  const info = [
    P('guest', C.grn) + P('@', C.soft) + P('termbook', C.grn),
    '─────────────────',
    row('Shell',   'jsh 0.2.0'),
    row('终端',    'xterm.js 5.5.0'),
    row('分辨率',  term.cols + 'x' + term.rows),
    row('运行时',  '纯前端 · 零后端'),
    row('已运行',  Math.floor((Date.now()-bootAt)/1000) + ' 秒'),

  return out;
}, '显示系统信息卡片');

/* ============================================================
   3. 执行器：管道 + 重定向
   ============================================================ */
async function runLine(raw){
  const line = raw.trim();
  if (!line) return [];
  // 重定向 >
  let redirect = null;
  if (line.includes('>')){
    const i = line.indexOf('>');
    redirect = line.slice(i+1).trim();
    raw = line.slice(0, i).trim();
  }
  const segs = raw.split('|').map(s=>s.trim()).filter(Boolean);
  let stdin = [], outputs = [];
  for (let i=0;i<segs.length;i++){
    const parts = segs[i].split(/\s+/).filter(Boolean);
    const name = parts[0], args = parts.slice(1);
    const cmd = CMDS[name];
    if (!cmd) return [P(`sh: 未找到命令: ${name}`, C.red) + '  ' + P('（试试 help）', C.soft)];
    if (['mkdir','touch','rm','cp','mv','vim','vi','nvim'].includes(name))
      return [P(`${name}: 访客模式为只读，不能修改或编辑文件。`, C.red)];
    let res;
    try { res = await cmd.fn({args, stdin, env, setCwd:(p)=>{cwd=p;}}); }
    catch(e){ return [P('sh: 执行出错: ' + e.message, C.red)]; }
    const lines = res == null ? [] : (Array.isArray(res) ? res : [String(res)]);
    if (i === segs.length-1) outputs.push(...lines);
    else stdin = lines.flatMap(l => String(l).split('\n'));
  }
  if (redirect){
    const {parent} = parentOf(redirect);
    if (parent && parent.type === 'dir')
      parent.children[redirect.split('/').pop()] = {name:redirect, type:'file', content:stripAnsi(outputs.join('\n'))};
  }
  return outputs;
}

/* ============================================================
   4. xterm 接线
   ============================================================ */
const THEME_DARK = {
  background:'#1C1F1B', foreground:'#D9D5CC', cursor:'#8FB39A', cursorAccent:'#1C1F1B',
  selectionBackground:'#3A4038', black:'#1C1F1B', brightBlack:'#6E6960',
  red:'#C67A6E', green:'#8FB39A', yellow:'#C2A17A', blue:'#8CA6AA',
  magenta:'#A98BA0', cyan:'#8CA6AA', white:'#D9D5CC', brightWhite:'#EFECE5'
};
const term = new Terminal({
  fontFamily:'ui-monospace, "Menlo", "Consolas", "MiSans", monospace',
  fontSize:15, lineHeight:1.4, cursorBlink:true, convertEol:true,
  scrollback:10000, theme:THEME_DARK, allowProposedApi:true
});
const Fit = (window.FitAddon && window.FitAddon.FitAddon) || window.FitAddon;
const fit = new Fit();
term.loadAddon(fit);
term.open(document.getElementById('term'));
try { fit.fit(); } catch(e){}

// iframe 首次布局、字体加载和浏览器地址栏收起都会改变可用高度。
// 只在 open() 后 fit 一次会导致底部 prompt 被截断，因此统一走稳定的重排入口。
let fitTimer;
function fitTerminal(){
  clearTimeout(fitTimer);
  fitTimer = setTimeout(() => {
    try { fit.fit(); term.scrollToBottom(); } catch(e){}
    if (window.VimEditor) VimEditor.resize();
  }, 0);
}
requestAnimationFrame(() => requestAnimationFrame(fitTerminal));
window.addEventListener('load', fitTerminal, { once: true });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTerminal);
if (window.ResizeObserver) new ResizeObserver(fitTerminal).observe(document.getElementById('term'));

const bootAt = Date.now();
let buf = '', locked = true;
const SESSION_KEY = 'termbook-guest-session-v1';
const savedSession = (() => {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || '{}'); }
  catch { return {}; }
})();

const PROMPT = () => P('guest', C.grn) + P('@', C.soft) + P('termbook', C.grn) + ' ' +
                     P(dispPath(), C.sand) + ' ' + P('$', C.grn2) + ' ';
const newLine = () => term.write('\r\n');
const writePrompt = (suffix = '') => term.write(PROMPT() + suffix, () => term.scrollToBottom());
const refresh = () => term.write('\r\x1b[K' + PROMPT() + buf, () => term.scrollToBottom());

const env = {
  history: Array.isArray(savedSession.history) ? savedSession.history.slice(-100) : [], hIdx: -1,
  clear: () => term.write('\x1b[2J\x1b[H'),
  setTheme: (t) => { term.options.theme = t; document.body.style.background = t.background || '#1C1F1B'; },
  reboot: () => { locked = true; buf=''; boot(); },
};

/* --- 启动横幅：按宽度自适应 --- */
function drawLogo(){
  const big = [
    '████████╗███████╗██████╗ ███╗   ███╗██████╗  ██████╗  ██████╗ ██╗  ██╗',
    '╚══██╔══╝██╔════╝██╔══██╗████╗ ████║██╔══██╗██╔═══██╗██╔═══██╗██║ ██╔╝',
    '   ██║   █████╗  ██████╔╝██╔████╔██║██████╔╝██║   ██║██║   ██║█████╔╝ ',
    '   ██║   ██╔══╝  ██╔══██╗██║╚██╔╝██║██╔══██╗██║   ██║██║   ██║██╔═██╗ ',
    '   ██║   ███████╗██║  ██║██║ ╚═╝ ██║██████╔╝╚██████╔╝╚██████╔╝██║  ██╗',
    '   ╚═╝   ╚══════╝╚═╝  ╚═╝╚═╝     ╚═╝╚═════╝  ╚═════╝  ╚═════╝ ╚═╝  ╚═╝',
  ];
  const small = [
    '┌─┐┌─┐┬─┐┌┬┐┌┐ ┌─┐┌┐┌┬┌─',
    '│  ├┤ ├┬┘│││├┴┐│ ││││││ │',
    '└─┘└─┘┴└─┴ ┴└─┘└─┘┘└┘┴└─',
  ];
  const art = term.cols >= 76 ? big : small;
  const out = ['', ...art.map(l => P(l, C.grn2)), ''];
  return out;
}

/* --- 启动序列 --- */
const BOOT = [
  ['0.0000', 'termbook kernel 0.2.0 启动', 'ok',   ''],
  ['0.0142', '挂载虚拟文件系统 vfs',        'ok',   ''],
  ['0.0307', '载入 xterm.js 5.5.0',        'ok',   C.grn],
  ['0.0518', '初始化行编辑 / 历史 / 补全',   'ok',   ''],
  ['0.0733', '探测终端尺寸',                'ok',   ''],
  ['0.0944', '启动 jsh',                   'ok',   C.grn],
];
function boot(){
  env.clear();
  const cols = term.cols;
  const rows = [];
  for (const [t, what, st, c] of BOOT){
    const dots = '.'.repeat(Math.max(2, (cols||80) - 26 - dispW(what) - dispW(t)));
    rows.push(P('[' + t + ']', C.soft) + ' ' + P(what, C.fg) + ' ' + dots + ' ' +
              P('[ ' + st + ' ]', c || C.grn));
  }
  let i = 0;
  const tick = () => {
    if (i < rows.length){ term.write(rows[i++] + '\r\n'); setTimeout(tick, 110); return; }
    setTimeout(() => {
      drawLogo().forEach(l => term.write(l + '\r\n'));
      term.write(P('  输入 ', C.soft) + P('help', C.grn) + P(' 看命令，', C.soft) +
                 P('about', C.grn) + P(' 看看它是怎么搭的。', C.soft) + '\r\n');
      newLine(); writePrompt();
      locked = false;
      if (env.history.length){
        term.write(P('  已恢复上次访客会话', C.soft) + '\r\n');
        // 只恢复命令历史供上下键浏览，不能在启动时重新执行历史命令。
        // 否则刷新页面会重复执行此前输入过的 ls/cat 等命令，造成输出不断增长。
        writePrompt();
      }
      window.__booted = true;
    }, 220);
  };
  term.write('\r\n'); tick();
}

/* --- 补全 --- */
function complete(){
  const parts = buf.split(/\s+/);
  const frag = parts[parts.length-1] || '';
  const isFirst = parts.length === 1;
  let pool;
  if (isFirst) pool = Object.keys(CMDS);
  else {
    const {parent} = parentOf(frag);
    pool = parent && parent.type === 'dir' ? Object.keys(parent.children) : [];
  }
  const base = frag.includes('/') ? frag.slice(frag.lastIndexOf('/')+1) : frag;
  const hits = pool.filter(n => n.startsWith(base)).sort();
  if (hits.length === 1){
    const prefix = frag.includes('/') ? frag.slice(0, frag.lastIndexOf('/')+1) : '';
    const node = !isFirst ? getNode(prefix + hits[0]) : null;
    buf = buf.slice(0, buf.length - base.length) + hits[0] + (node && node.type === 'dir' ? '/' : ' ');
    refresh();
  } else if (hits.length > 1){
    newLine(); term.write(hits.map(h => P(h, C.grn)).join('   '));
    newLine(); writePrompt(buf);
  }
}

async function submit(){
  if (locked) return;
  locked = true;
  const line = buf; buf = '';
  newLine();
  try {
    if (line.trim()){
      env.history.push(line); env.hIdx = env.history.length;
      try { localStorage.setItem(SESSION_KEY, JSON.stringify({ history: env.history.slice(-100) })); } catch {}
      const out = await runLine(line);
      if (out && out.length) term.write(out.join('\r\n') + '\r\n');
    }
  } catch (error) {
    term.write(P(`sh: ${error.message || '命令执行失败'}`, C.red) + '\r\n');
  } finally {
    locked = false;
    writePrompt();
  }
}

term.onData(d => {
  if (locked) return;
  if (VimEditor && VimEditor.active){ VimEditor.key(d); return; }
  if (d === '\r'){ void submit(); return; }
  if (d === '\u007f'){ if (buf.length){ buf = buf.slice(0,-1); refresh(); } return; }
  if (d === '\t'){ complete(); return; }
  if (d === '\u0003'){ term.write('^C'); buf=''; newLine(); writePrompt(); return; }
  if (d === '\u000c'){ env.clear(); writePrompt(); return; }
  if (d === '\u001b[A' || d === '\u001b[B'){
    if (!env.history.length) return;
    env.hIdx = Math.max(0, Math.min(env.history.length, env.hIdx + (d === '\u001b[A' ? -1 : 1)));
    buf = env.history[env.hIdx] || ''; refresh(); return;
  }
  if (d >= ' ') buf += d, term.write(d);
});

/* --- 自适应窗口 --- */
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(fitTerminal, 80);
});

/* --- vim 与虚拟文件系统的桥接 --- */
VimEditor.install(term, {
  read: (p) => { const n = getNode(p); return (n && n.type === 'file') ? n.content : null; },
  write: (p, txt) => {
    const { parent } = parentOf(p);
    const nm = p.split('/').pop();
    if (parent && parent.type === 'dir') parent.children[nm] = { name: nm, type: 'file', content: txt };
  },
  onExit: (msg) => {
    if (msg) term.write(P(msg, C.soft) + '\r\n');
    writePrompt();
  },
});

boot();
window.__vim = (arg) => vimOpen(arg);
window.__run = (c) => { if (!locked){ buf = c; void submit(); } };
window.__ready = true;
</script>
